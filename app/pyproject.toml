[project]
name = "app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "json-repair>=0.63.5",
    "langchain>=1.4.2",
    "langchain-core>=1.6.4",
    "langchain-google-genai>=4.4.0",
    "langchain-nvidia-ai-endpoints>=1.4.3",
    "langchain-openai>=1.6.5",
    "langgraph>=1.2.12",
    "neo4j>=5.20",
    "onnxruntime>=1.20,<1.24",
    "pydantic>=2.13.5",
    "pypdf>=6.19.0",
    "pypdfium2>=5.13.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.19.1",
    "rank-bm25>=0.2.2",
    "rapidocr>=3.9.2",
    "uvicorn>=0.53.0",
]

[tool.pytest.ini_options]
markers = [
    "cloud: hits real Qdrant Cloud + NVIDIA (opt-in via RUN_CLOUD_TESTS=1)",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
